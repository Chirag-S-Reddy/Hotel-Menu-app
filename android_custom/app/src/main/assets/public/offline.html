<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline | Fusioni</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#FDFBF7] text-[#222222] min-h-screen flex items-center justify-center p-6 text-center">
    <div class="max-w-md space-y-4">
        <h1 class="text-3xl font-serif text-[#1B4D3E] font-bold">You are currently offline</h1>
        <p class="text-sm text-gray-600">Please check your internet connection to access real-time table reservations and digital ordering updates.</p>
        <button onclick="window.location.reload()" class="bg-[#C85A32] text-white px-6 py-2.5 rounded text-xs font-bold uppercase tracking-widest hover:bg-[#1B4D3E] transition">
            Retry Connection
        </button>
    </div>
</body>
</html>
